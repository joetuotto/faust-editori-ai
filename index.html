<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:;">
    <title>FAUST - Esoteerinen kirjoituseditori</title>

    <!-- First paint in the stored theme (the key app.js reads); only the two theme names are accepted -->
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('faust-theme')==='DEIS'?'DEIS':'NOX')}catch(e){}</script>

    <!-- Legacy theme file; superseded by faust-tokens.css and deleted in clean-up -->
    <link rel="stylesheet" href="./styles/faust-theme.css" />
    <!-- Design tokens (NOX/DEIS), aliases for every name the code uses, element base -->
    <link rel="stylesheet" href="./styles/faust-tokens.css" />

    <!-- NEW: Simple Clean Layout (replaces complex grid) -->
    <link rel="stylesheet" href="./styles/faust-simple-layout.css" />
    <!-- Component recipes, shell classes, the chat window (was claude-chat.css) and the legacy bridge -->
    <link rel="stylesheet" href="./styles/faust-components.css" />

    <!-- PR1: Google Fonts (EB Garamond & IBM Plex Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Tailwind CDN removed for production - use PostCSS/CLI for production builds -->
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #root {
            height: 100vh;
        }
    </style>
    <!-- React before bundle.js. Served from the app itself (copied from
         node_modules by scripts/post-build.js) so FAUST starts without a network. -->
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>

    <!-- FAUST Constants & Utilities -->
    <script src="./src/utils/constants.js"></script>
    <script src="./src/utils/annotationTypes.js"></script>
    <script src="./src/services/ai/AIProviderRouter.js"></script>
    <script src="./src/services/ai/CharacterGenerator.js"></script>
    <script src="./src/services/story/ComplexityAnalyzer.js"></script>

    <!-- FAUST UI Components -->
    <script src="./src/components/AnnotationMargin.js"></script>
    <script src="./src/components/Modals/LocationSheetModal.js"></script>
    <script src="./src/components/Modals/ThreadSheetModal.js"></script>
    <script src="./src/components/Modals/ChapterSheetModal.js"></script>

    <!-- Claude Chat Component -->
    <script src="./src/components/ClaudeChat/ClaudeChat.js"></script>
</head>
<body>
    <div id="root"></div>
    <!-- Webpack injektaa bundle.js automaattisesti tähän -->
</body>
</html>
